<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Heart-Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="{{ url_for('static', filename='style.css') }}?t={{ config['TIMESTAMP'] }}" rel="stylesheet">

    <style>
        :root {
            --primary: #0f70de;
            --secondary: #0dcaf0;
            --accent: #9e1522;
        }

        /* Efek Transparan & Kaca untuk Navbar */
        .glass-navbar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .nav-link {
            font-weight: 600;
            color: #6b7280;
            transition: color 0.3s ease;
        }
        
        .nav-link:hover, .nav-link.active {
            color: #0f70de !important;
        }

        /* Tailwind config for custom colors */
        .text-primary { color: #0f70de; }
        .bg-primary { background-color: #0f70de; }
        .text-secondary { color: #0dcaf0; }
        .bg-secondary { background-color: #0dcaf0; }
        .text-accent { color: #9e1522; }
        .bg-accent { background-color: #9e1522; }

        .hover\:bg-primary:hover { background-color: #0f70de; }
        .hover\:bg-secondary:hover { background-color: #0dcaf0; }
    </style>
</head>

<body class="bg-slate-50 pt-20">
    <nav class="glass-navbar fixed top-0 left-0 right-0 z-50 w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a class="flex items-center font-bold text-primary hover:text-primary" href="/">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Heart-Sync" width="30" height="30" class="mr-2 rounded-full shadow-sm">
                    <span class="text-xl">Heart-Sync</span>
                </a>
                <div class="hidden md:flex gap-1">
                    <a href="/" class="nav-link px-4 py-2 rounded-lg transition {% if active_page == 'home' %}!text-primary bg-slate-100{% endif %}">Beranda</a>
                    <a href="/prediksi" class="nav-link px-4 py-2 rounded-lg transition {% if active_page == 'prediksi' %}!text-primary bg-slate-100{% endif %}">Prediksi</a>
                    <a href="/info" class="nav-link px-4 py-2 rounded-lg transition {% if active_page == 'info' %}!text-primary bg-slate-100{% endif %}">Info Model</a>
                    <a href="/team" class="nav-link px-4 py-2 rounded-lg transition {% if active_page == 'team' %}!text-primary bg-slate-100{% endif %}">Tim Kami</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="py-14">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="mt-12 py-6 border-t border-slate-200 bg-white bg-opacity-80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-slate-500 font-semibold text-sm">
            <span class="text-accent">❤️</span> Heart-Sync &copy; 2026 · Deteksi dini risiko penyakit jantung menggunakan Machine Learning
        </div>
    </footer>
</body>

</html>
